services:
  database:
    image: postgres:16
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-empleadosdb}
      POSTGRES_USER: ${DB_USER:-empleado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-empleado_pass}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-empleado_user} -d ${DB_NAME:-empleadosdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: backend:dev
    container_name: backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-empleadosdb}
      DB_USER: ${DB_USER:-empleado_user}
      DB_PASSWORD: ${DB_PASSWORD:-empleado_pass}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-admin123}
      SPRING_PROFILES_ACTIVE: dev
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - app_net

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    image: frontend:dev
    container_name: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - app_net

  proxy:
    build:
      context: ../..
      dockerfile: docker/proxy/Dockerfile
    image: proxy:dev
    container_name: proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    name: ${COMPOSE_NETWORK_NAME:-empleado_app_net}
