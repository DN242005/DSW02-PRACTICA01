name: 04-DockerHub

on:
  workflow_run:
    workflows:
      - '03 Cypress'
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to DockerHub
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/crud-empleados-api:main

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/crud-empleados-frontend:main

      - name: Verify images pushed
        run: |
          echo "Backend image pushed: ${{ secrets.DOCKER_USERNAME }}/crud-empleados-api"
          echo "Frontend image pushed: ${{ secrets.DOCKER_USERNAME }}/crud-empleados-frontend"
