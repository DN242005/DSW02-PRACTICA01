name: 03 Cypress

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  cypress-auth:
    name: Cypress Auth E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Start Docker Compose stack
        run: docker compose -f ../docker/postgres/docker-compose.yml up -d database backend frontend proxy

      - name: Wait for proxy and frontend
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1/healthz >/dev/null; then
              echo "Proxy and frontend are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Proxy/frontend did not start in time"
          docker compose -f ../docker/postgres/docker-compose.yml ps
          exit 1

      - name: Run Cypress authentication test
        run: npm run cy:login

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f ../docker/postgres/docker-compose.yml down
